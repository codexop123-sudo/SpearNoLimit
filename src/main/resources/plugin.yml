name: SpearNoLimit
version: '1.0'
main: me.spearnolimit.SpearNoLimit
api-version: '1.21'
description: Removes the Spear's jab cooldown and the hunger cost of Lunge attacks.
commands:
  spearnolimit:
    description: Manage which players have the spear boost enabled.
    usage: /spearnolimit select <player> | remove <player> | list
